<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anton Thomz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/engine@3/tsparticles.engine.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/slim@3/tsparticles.slim.bundle.min.js"></script>
    <style>
        *{box-sizing:border-box;}
        html{scroll-behavior:smooth;}
        body{margin:0;min-height:100vh;background:#050505;color:white;font-family:"Inter",sans-serif;}
        #particles{position:fixed;inset:0;z-index:0;pointer-events:none;}
        .glow{position:fixed;width:380px;height:380px;border-radius:50%;filter:blur(120px);pointer-events:none;opacity:.08;z-index:0;}
        .glow-1{top:-180px;left:-150px;background:#8b5cf6;}
        .glow-2{right:-180px;top:45%;background:#ec4899;}
        .current-date {
            font-size: 8px;
            font-weight: 400;
            letter-spacing: .14em;
            color: rgba(255,255,255,.25);
            text-transform: uppercase;
        }
        .avatar {
            position: relative;
            width: 92px;
            height: 92px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,.12);
            box-shadow:
                0 0 0 6px rgba(255,255,255,.015),
                0 0 35px rgba(139,92,246,.16);
            transition:
                transform .5s ease,
                box-shadow .5s ease;
        }
        .avatar:hover {
            transform: scale(1.04);
            box-shadow:
                0 0 0 6px rgba(255,255,255,.025),
                0 0 45px rgba(139,92,246,.3);
        }
        .verified {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            background: #3b82f6;
            box-shadow: 0 0 12px rgba(59,130,246,.35);
        }
        .verified i {font-size:8px;}
        .link {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 58px;
            padding: 0 17px;
            border-radius: 15px;
            background: rgba(255,255,255,.035);
            border: 1px solid rgba(255,255,255,.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition:
                transform .25s ease,
                background .25s ease,
                border-color .25s ease,
                box-shadow .25s ease;
        }
        .link:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,.065);
            border-color: rgba(255,255,255,.13);
            box-shadow: 0 12px 35px rgba(0,0,0,.18);
        }
        .link:active {transform: scale(.985);}
        .link-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: rgba(255,255,255,.045);
            transition:
                transform .25s ease,
                filter .25s ease;
        }
        .link:hover .link-icon{
            transform:scale(1.08);
            filter:brightness(1.15);
        }
        .link-title{
            font-size:12px;
            font-weight:500;
            letter-spacing:-.01em;
        }
        .link-subtitle{
            margin-top:2px;
            font-size:9px;
            color:rgba(255,255,255,.30);
            font-weight:300;
        }
        .section-title{
            font-size:8px;
            text-transform:uppercase;
            letter-spacing:.22em;
            color:rgba(255,255,255,.20);
        }
        .mini-social{
            display:flex;
            align-items:center;
            justify-content:center;
            width:35px;
            height:35px;
            border-radius:50%;
            color:rgba(255,255,255,.42);
            border:1px solid rgba(255,255,255,.06);
            background:rgba(255,255,255,.025);
            transition:color .25s ease,transform .25s ease,background .25s ease,border-color .25s ease;
        }
        .mini-social:hover{transform:translateY(-2px);background:rgba(255,255,255,.07);}
        .social-tiktok i{color:#ffffff;}
        .social-tiktok:hover{color:#ffffff;border-color:rgba(255,255,255,.2);}
        .social-github i{color:#f0f0f0;}
        .social-github:hover{color:#ffffff;border-color:rgba(255,255,255,.2);}
        .social-facebook i{color:#1877f2;}
        .social-facebook:hover{color:#1877f2;border-color:rgba(24,119,242,.3);background:rgba(24,119,242,.08);}
        .social-whatsapp i{color:#25d366;}
        .social-whatsapp:hover{color:#25d366;border-color:rgba(37,211,102,.3);background:rgba(37,211,102,.08);}
        .icon-tiktok{color:#ffffff;}
        .icon-github{color:#f0f0f0;}
        .icon-facebook{color:#1877f2;}
        .icon-whatsapp{color:#25d366;}
        .donate{background:linear-gradient(110deg, rgba(139,92,246,.11), rgba(236,72,153,.07));border-color:rgba(168,85,247,.16);}
        .donate:hover{border-color:rgba(168,85,247,.28);}
    </style>
</head>
<body>
    <div id="particles"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <main class="relative z-10 min-h-screen flex justify-center px-5 py-12 sm:py-16">
        <div class="w-full max-w-[420px]">
            <div data-aos="fade" data-aos-duration="800" class="text-center mb-7">
                <span id="current-date" class="current-date">
                    Loading date...
                </span>
            </div>

            <section data-aos="fade-up" data-aos-duration="800" class="text-center">
                <img src="admin.png" alt="Anton Thomz" class="avatar mx-auto">

                <div class="mt-5 flex items-center justify-center gap-1.5">
                    <h1 class="text-[19px] font-semibold tracking-[-.035em]">Anton Thomz</h1>
                    <span class="verified" title="Verified Profile">
                        <i class="fa-solid fa-check"></i>
                    </span>
                </div>

                <p class="mt-2 mx-auto max-w-[300px] text-[10px] leading-4 font-light text-white/40">
                    Just another person who likes<br>
                    technology, code and creating things.
                </p>

                <div class="flex justify-center gap-2 mt-5">
                    <a href="https://www.tiktok.com/@antonthomz_" target="_blank" rel="noopener noreferrer" class="mini-social social-tiktok" aria-label="TikTok">
                        <i class="fa-brands fa-tiktok text-xs"></i>
                    </a>

                    <a href="https://github.com/antonthomzz" target="_blank" rel="noopener noreferrer" class="mini-social social-github" aria-label="GitHub">
                        <i class="fa-brands fa-github text-xs"></i>
                    </a>

                    <a href="https://www.facebook.com/profile.php?id=61592424722958" target="_blank" rel="noopener noreferrer" class="mini-social social-facebook" aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f text-xs"></i>
                    </a>

                    <a href="https://wa.me/6283122054460" target="_blank" rel="noopener noreferrer" class="mini-social social-whatsapp" aria-label="WhatsApp">
                        <i class="fa-brands fa-whatsapp text-xs"></i>
                    </a>
                </div>
            </section>

            <section class="mt-9">
                <div data-aos="fade" class="mb-3">
                    <span class="section-title">
                        Find me
                    </span>
                </div>

                <div class="space-y-2.5">
                    <a href="https://www.tiktok.com/@antonthomz_" target="_blank" rel="noopener noreferrer" data-aos="fade-up" data-aos-delay="50" class="link">
                        <div class="link-icon icon-tiktok">
                            <i class="fa-brands fa-tiktok text-xs"></i>
                        </div>
                        <div class="ml-3 flex-1">
                            <div class="link-title">TikTok</div>
                            <div class="link-subtitle">@antonthomz_</div>
                        </div>
                        <i class="fa-solid fa-arrow-up-right-from-square text-[8px] text-white/15"></i>
                    </a>

                    <a href="https://github.com/antonthomzz" target="_blank" rel="noopener noreferrer" data-aos="fade-up" data-aos-delay="100" class="link">
                        <div class="link-icon icon-github">
                            <i class="fa-brands fa-github text-xs"></i>
                        </div>
                        <div class="ml-3 flex-1">
                            <div class="link-title">GitHub</div>
                            <div class="link-subtitle">@antonthomzz</div>
                        </div>
                        <i class="fa-solid fa-arrow-up-right-from-square text-[8px] text-white/15"></i>
                    </a>

                    <a href="https://www.facebook.com/profile.php?id=61592424722958" target="_blank" rel="noopener noreferrer" data-aos="fade-up" data-aos-delay="150" class="link">
                        <div class="link-icon icon-facebook">
                            <i class="fa-brands fa-facebook-f text-xs"></i>
                        </div>
                        <div class="ml-3 flex-1">
                            <div class="link-title">Facebook</div>
                            <div class="link-subtitle">Connect with me</div>
                        </div>
                        <i class="fa-solid fa-arrow-up-right-from-square text-[8px] text-white/15"></i>
                    </a>

                    <a href="https://wa.me/6283122054460" target="_blank" rel="noopener noreferrer" data-aos="fade-up" data-aos-delay="200" class="link">
                        <div class="link-icon icon-whatsapp">
                            <i class="fa-brands fa-whatsapp text-xs"></i>
                        </div>
                        <div class="ml-3 flex-1">
                            <div class="link-title">WhatsApp</div>
                            <div class="link-subtitle">Send me a message</div>
                        </div>
                        <i class="fa-solid fa-arrow-up-right-from-square text-[8px] text-white/15"></i>
                    </a>
                </div>
            </section>

            <section class="mt-8">
                <div data-aos="fade-up" data-aos-delay="250" class="mb-3">
                    <span class="section-title">
                        Support
                    </span>
                </div>

                <div data-aos="fade-up" data-aos-delay="250" class="flex">
                    <a href="qr.jpg" download="anton-donate.jpg" title="Download QR" class="group block">
                        <div class="relative p-1.8 transition-all duration-300 group-hover:scale-105 group-hover:shadow-[0_0_35px_rgba(168,85,247,.18)] group-active:scale-95">
                            <img src="qr.jpg" alt="Support QR Code" class="w-[82px] h-[82px] rounded-lg object-cover">
                        </div>
                        <div class="mt-2 text-center">
                            <span class="text-[8px] text-white/20 tracking-[.12em] uppercase">
                                Tap to download
                            </span>
                        </div>
                    </a>
                </div>
            </section>

            <footer data-aos="fade" data-aos-delay="350"class="mt-10 text-center">
                <p class="text-[8px] font-light tracking-[.18em] uppercase text-white/15">Anton Thomz</p>
                <p id="footer-year" class="mt-2 text-[8px] text-white/10">©</p>
            </footer>
        </div>
    </main>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
        AOS.init({
            once: true,
            duration: 650,
            easing: "ease-out-cubic",
            offset: 20
        });

        function updateDate() {
            const now = new Date();
            const date = new Intl.DateTimeFormat("id-ID", {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            }).format(now);
            document.getElementById("current-date").textContent = date;
            document.getElementById("footer-year").textContent = `© ${now.getFullYear()}`;
        }
        updateDate();
        tsParticles.load({
            id: "particles",
            options: {
                fullScreen: {
                    enable: false
                },
                particles: {
                    number: {
                        value: 35,
                        density: {
                            enable: true,
                            area: 1000
                        }
                    },
                    color: {
                        value: [
                            "#ffffff",
                            "#a78bfa"
                        ]
                    },
                    opacity: {
                        value: {
                            min: .04,
                            max: .18
                        }
                    },
                    size: {
                        value: {
                            min: .5,
                            max: 1.5
                        }
                    },
                    move: {
                        enable: true,
                        speed: .25,
                        random: true,
                        direction: "none",
                        outModes: {
                            default: "out"
                        }
                    },
                    links: {
                        enable: true,
                        distance: 160,
                        color: "#a78bfa",
                        opacity: .045,
                        width: 1
                    }
                },
                interactivity: {
                    events: {
                        onHover: {
                            enable: true,
                            mode: "grab"
                        },
                        onClick: {
                            enable: true,
                            mode: "push"
                        }
                    },
                    modes: {
                        grab: {
                            distance: 120,
                            links: {
                                opacity: .15
                            }
                        },
                        push: {
                            quantity: 2
                        }
                    }
                },
                detectRetina: true
            }
        });
    </script>
</body>
</html>
