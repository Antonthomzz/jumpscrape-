<!DOCTYPE html>
<html lang="su">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        #particles-js {
            position: fixed;
            inset: 0;
            z-index: -1;
        }
    </style>
</head>
<body class="bg-black text-white">
    <div id="particles-js"></div>
    <div class="min-h-screen flex flex-col justify-center items-center px-6">
        <div class="[transform:perspective(1000px)_rotateX(20deg)_rotateY(-20deg)_rotateZ(8deg)_translateZ(40px)] flex flex-col items-center">
            <p id="tanggal" class="text-[11px] text-zinc-500 tracking-[0.35em] uppercase mb-3"></p>
            <img src="IMG-20260801-WA0016.jpg" class="w-64 h-72 object-cover rounded-xl shadow-2xl"/>
        </div>

        <div class="mt-10 max-w-sm text-center">
            <h1 class="text-sm uppercase tracking-[0.45em] text-zinc-400 mb-6">For You — Asyifa</h1>
            <p class="text-xs leading-2 font-mono text-zinc-300">
                Makasih nya geus jadi aww aing.<br>
                aing rumasa goreng adat, sok ngadat teu paruguh.<br>
                tapi da aing ge aslina mah nyaah,<br>
                sing ngarti saeutik mah hh🥴
            </p>
            <p class="mt-6 text-[10px] font-mono tracking-[0.45em] text-zinc-600">⸻ anton ⸻</p>
            <p id="jam" class="mt-8 text-[11px] tracking-[0.35em] text-zinc-500"></p>
        </div>
    </div>
    <script>
        function waktu() {
            const hari = [
                "Minggu",
                "Senin",
                "Selasa",
                "Rabu",
                "Kamis",
                "Jum'at",
                "Sabtu"
            ];
            const bulan = [
                "Januari",
                "February",
                "Maret",
                "April",
                "Mei",
                "Juni",
                "Juli",
                "Agustus",
                "September",
                "Oktober",
                "November",
                "Desember"
            ];

            const d = new Date();

            document.getElementById("tanggal").innerHTML = `${hari[d.getDay()]}, ${d.getDate()} ${bulan[d.getMonth()]} ${d.getFullYear()}`;
            document.getElementById("jam").innerHTML = `${String(d.getHours()).padStart(2,"0")} : ${String(d.getMinutes()).padStart(2,"0")} : ${String(d.getSeconds()).padStart(2,"0")}`;
        }

        setInterval(waktu,1000);
        waktu();

        particlesJS("particles-js", {
            particles: {
                number: { value: 500 },
                color: { value: "#ffffff" },
                shape: { type: "circle" },
                opacity: { value: 0.18 },
                size: { value: 1 },
                move: { enable: true, speed: 0.6 },
                line_linked: { enable: false }
            },
            interactivity: {
                events: {
                    onhover: {
                        enable: true,
                        mode: "repulse"
                    }
                }
            },
            retina_detect:true
        });
    </script>
</body>
</html>
